    retry: 'Riprova'
    partial:
        title: 'Una parte della tua modifica potrebbe essere stata salvata'
        lead: 'Una parte della tua modifica potrebbe essere stata salvata prima che gli stessi dati venissero modificati contemporaneamente. Ricarica prima di riprovare.'
        hint: 'Controlla prima cosa è stato salvato: inviare di nuovo la stessa modifica potrebbe ripeterla.'
        retry: 'Ricarica'
