name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  git-hygiene:
    name: Git history (no AI co-author trailers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor / Claude co-author trailers (REQ-GIT-001)
        run: sh .scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }}${{ matrix.deps != '' && format(' - {0}', matrix.deps) || '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: ['']
        include:
          # DBAL 3 legs (1.1.0 supports doctrine/dbal ^3.8.2 || ^4).
          - php: '8.4'
            deps: 'DBAL 3 + ORM 3'
            dbal: '^3.8.2'
            orm: '^3.0'
          - php: '8.2'
            deps: 'DBAL 3 + ORM 2'
            dbal: '^3.8.2'
            orm: '^2.20'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == '8.2' && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Pin DBAL / ORM majors
        if: matrix.deps != ''
        run: |
          composer require "doctrine/dbal:${{ matrix.dbal }}" --no-update --no-interaction
          composer require --dev "doctrine/orm:${{ matrix.orm }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies

      - name: Run tests
        if: matrix.php != '8.2' || matrix.deps != ''
        run: vendor/bin/phpunit --no-coverage

      - name: Run tests with coverage (100% lines and methods required)
        if: matrix.php == '8.2' && matrix.deps == ''
        run: |
          vendor/bin/phpunit --coverage-text --coverage-clover coverage.xml
          php -r '$m = simplexml_load_file("coverage.xml")->project->metrics; $s = (int) $m["statements"]; $cs = (int) $m["coveredstatements"]; $me = (int) $m["methods"]; $cm = (int) $m["coveredmethods"]; echo "lines $cs/$s, methods $cm/$me\n"; exit($s > 0 && $cs === $s && $cm === $me ? 0 : 1);'


  database:
    name: Real databases (MySQL 8.4, MariaDB 11.4, PostgreSQL 16) - ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - deps: 'DBAL 4 + ORM 3'
            dbal: '^4.0'
            orm: '^3.0'
          - deps: 'DBAL 3 + ORM 3'
            dbal: '^3.8.2'
            orm: '^3.0'
          - deps: 'DBAL 3 + ORM 2'
            dbal: '^3.8.2'
            orm: '^2.20'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ddrb
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ddrb
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: ddrb
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Pin DBAL / ORM majors
        run: |
          composer require "doctrine/dbal:${{ matrix.dbal }}" --no-update --no-interaction
          composer require --dev "doctrine/orm:${{ matrix.orm }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies

      - name: Real deadlock / lock wait / serialization tests (none may be skipped)
        env:
          TD_MYSQL_URL: mysql://root:root@127.0.0.1:3306/ddrb
          TD_MARIADB_URL: mysql://root:root@127.0.0.1:3307/ddrb
          TD_POSTGRES_URL: pgsql://postgres:root@127.0.0.1:5432/ddrb
        run: vendor/bin/phpunit --testsuite Database --no-coverage --fail-on-skipped

  without-messenger:
    name: Without symfony/messenger (ConflictCode, runner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Remove symfony/messenger
        run: composer remove --dev symfony/messenger --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies

      - name: Messenger is absent
        run: |
          php -r 'require "vendor/autoload.php"; exit(interface_exists("Symfony\\Component\\Messenger\\Exception\\WrappedExceptionsInterface") ? 1 : 0);'

      - name: Messenger-free tests
        run: |
          vendor/bin/phpunit --no-coverage tests/Unit/ConflictCodeTest.php
          vendor/bin/phpunit --no-coverage tests/Unit/DoctrineTransactionRunnerTest.php
          vendor/bin/phpunit --no-coverage tests/Unit/HostEntityManagerSqliteTest.php

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Rector (dry run)
        run: composer rector-dry

      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor

      - name: Composer audit
        run: composer audit

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
